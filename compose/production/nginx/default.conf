# Pure static file server behind Traefik. All path routing lives in
# compose/production/traefik/traefik.yml: Django-reserved prefixes
# (/api /admin /users /accounts /static) go straight to django:5000; nginx only
# serves the SPA shell, /assets/ bundles and /media/.
#
# INVARIANTS — do not reintroduce proxying here:
# - No proxy_pass/proxy_set_header: nginx listens on plain :80, so
#   `X-Forwarded-Proto $scheme` would send "http" and loop SECURE_SSL_REDIRECT,
#   while `$http_x_forwarded_proto` becomes client-controlled the moment nginx
#   is reachable by anything other than Traefik.
# - No env_file/templates: nginx must never learn DJANGO_ADMIN_URL or other
#   DJANGO_* secrets.
# - add_header in a location REPLACES all inherited add_header directives —
#   header sets below are intentionally per-location, not layered.
server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;

    # React SPA shell with client-side routing fallback
    location / {
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Vite content-hashed bundles: cache forever, and 404 on a miss — falling
    # back to index.html would serve text/html for a stale bundle hash and
    # white-screen the app after a deploy.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The shell itself must never be cached, or stale HTML pins old bundle
    # hashes.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Django media files (user uploads) from the shared read-only volume.
    # nosniff + CSP sandbox neuter stored-XSS via uploaded SVG/HTML on direct
    # navigation; <img>/download embedding is unaffected.
    location /media/ {
        alias /usr/share/nginx/media/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }
}
